# =====================================================================
# ПРОВЕРКА ПОСЛЕ ВЫКЛАДКИ (GitHub Actions): боевой адрес отдаёт этот коммит
# =====================================================================
# Зачем: выкладывает приложение Vercel (из этого же репозитория — своя сборка
# на каждый push в main). CI проверяет РЕПОЗИТОРИЙ и о том, что реально
# увидел сотрудник, ничего не знает. А ломается именно на выкладке:
#
#   * сборку Tailwind сделали в ветке и забыли закоммитить css/tailwind.css —
#     на хостинге старый файл, кнопки без цветов, ошибок нигде нет;
#   * подняли SHELL_REVISION, но старый sw.js остался в кэше хостинга — у
#     сотрудников продолжает работать service worker со СТАРОЙ политикой CSP
#     (вместо библиотек приходит 504);
#   * файл оболочки не уехал (.vercelignore) — приложение работает до
#     закрытия вкладки;
#   * боевой js/config.js смотрит не на ту базу.
#
# Эта задача спрашивает хостинг то же самое, что и глаз в DevTools (README →
# «Проверка после деплоя»), но сама и с кодом возврата. Ждёт она до 10 минут:
# после выкладки точки присутствия CDN ещё отдают прежнюю сборку, и без
# ожидания задача ругалась бы на нормально работающий сайт.
#
# Секрет: SITE_URL — боевой адрес (например https://<проект>.vercel.app).
# Без него задача печатает предупреждение и завершается успешно, чтобы
# репозиторий не считался сломанным до настройки (см. ops/README.md).
# =====================================================================
name: Проверка после выкладки

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: post-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Боевой адрес отдаёт этот коммит
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Значение секрета вытаскиваем в шаг: так его видно и в `if` следующих
      # шагов, и в предупреждении, когда он ещё не заведён.
      - name: Есть ли адрес сайта (секрет SITE_URL)
        id: site
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::warning title=Проба не выполнялась::Секрет SITE_URL не задан — заведите его, иначе выкладка никем не проверяется (см. ops/README.md)"
          else
            echo "url=$SITE_URL" >> "$GITHUB_OUTPUT"
          fi

      - name: Ждём, пока хостинг отдаст новый коммит
        if: steps.site.outputs.url != ''
        env:
          SITE_URL: ${{ steps.site.outputs.url }}
        run: node tools/ops/probe-live.mjs --wait=600

      - name: Отчёт пробы
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-post-deploy
          path: /tmp/freedom-fin/*.txt
          if-no-files-found: ignore
